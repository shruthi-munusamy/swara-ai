# Carnatic Melakarta Ragas
#
# All 72 parent ragas of the Melakarta system. Each is sampurna (uses all
# seven swaras in both ascending and descending order).
#
# Schema:
#   number: 1-72
#   name: common name (primary)
#   melakarta_name: formal Sanskrit name (only when it differs from name)
#   arohanam: ascending sequence, inclusive of upper Sa (S')
#   avarohanam: descending sequence
#   swaras: unique swara set used in the raga
#   allied_ragas: list of ragas commonly confused with this one (empty for now)
#   notes: optional context
#
# Swara notation:
#   S R1 R2 R3 G1 G2 G3 M1 M2 P D1 D2 D3 N1 N2 N3
#   Upper-octave Sa is written S'.
#
# Cents values for each swarasthana are defined in src/swara/definitions.py
# (12-TET baseline; ±35c tolerance configured in config.yaml).
#
# Transliteration policy:
#   ASCII-normalized Carnatic raga names without diacritics.
#   Common concert/practical spellings preferred over strict Sanskrit
#   transliteration (e.g. Gavambodhi rather than Ghavāmbhodi).

